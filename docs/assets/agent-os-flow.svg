<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Agent OS Skill request-to-completion flow</title>
  <desc id="desc">A user task moves through understanding, scope lock, and read before write, then stops at a Write Gate. Only after the user replies APPROVE WRITE does the agent execute, verify, and produce an honest completion report.</desc>
  <style>
    :root { color-scheme: light dark; }
    .bg { fill: #f8fafc; }
    .card { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
    .primary { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
    .read { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; }
    .write { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
    .final { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
    .title { fill: #0f172a; font: 700 22px ui-sans-serif, system-ui, sans-serif; }
    .label { fill: #0f172a; font: 700 16px ui-sans-serif, system-ui, sans-serif; }
    .meta { fill: #475569; font: 500 12px ui-sans-serif, system-ui, sans-serif; }
    .step { fill: #64748b; font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .06em; }
    .line { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #64748b; }
      .primary { fill: #102445; stroke: #60a5fa; }
      .read { fill: #083344; stroke: #22d3ee; }
      .write { fill: #431407; stroke: #fb923c; }
      .final { fill: #052e16; stroke: #4ade80; }
      .title, .label { fill: #f8fafc; }
      .meta, .step { fill: #cbd5e1; }
      .line { stroke: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="480" rx="24"/>
  <text class="title" x="600" y="40" text-anchor="middle">Every task follows the same governed path</text>

  <!-- Row 1: 1..5 -->
  <g>
    <rect class="card" x="24" y="80" width="208" height="100" rx="16"/>
    <text class="step" x="128" y="104" text-anchor="middle">STEP 1</text>
    <text class="label" x="128" y="132" text-anchor="middle">USER TASK</text>
    <text class="meta" x="128" y="154" text-anchor="middle">Natural language</text>

    <path class="line" d="M232 130 H248"/>
    <rect class="read" x="252" y="80" width="208" height="100" rx="16"/>
    <text class="step" x="356" y="104" text-anchor="middle">STEP 2</text>
    <text class="label" x="356" y="132" text-anchor="middle">UNDERSTAND</text>
    <text class="meta" x="356" y="154" text-anchor="middle">Classify intent + risk</text>

    <path class="line" d="M460 130 H476"/>
    <rect class="primary" x="480" y="80" width="208" height="100" rx="16"/>
    <text class="step" x="584" y="104" text-anchor="middle">STEP 3</text>
    <text class="label" x="584" y="132" text-anchor="middle">SCOPE LOCK</text>
    <text class="meta" x="584" y="154" text-anchor="middle">G1 · bound the task</text>

    <path class="line" d="M688 130 H704"/>
    <rect class="read" x="708" y="80" width="208" height="100" rx="16"/>
    <text class="step" x="812" y="104" text-anchor="middle">STEP 4</text>
    <text class="label" x="812" y="132" text-anchor="middle">READ BEFORE WRITE</text>
    <text class="meta" x="812" y="154" text-anchor="middle">G2 · inspect real state</text>

    <path class="line" d="M916 130 H932"/>
    <rect class="write" x="936" y="80" width="208" height="100" rx="16"/>
    <text class="step" x="1040" y="104" text-anchor="middle">STEP 5</text>
    <text class="label" x="1040" y="132" text-anchor="middle">WRITE GATE</text>
    <text class="meta" x="1040" y="154" text-anchor="middle">G3 · scope shown, WAIT</text>
  </g>

  <!-- connector down to row 2 -->
  <path class="line" d="M1040 180 C1040 250 148 210 128 280"/>

  <!-- Row 2: 6..9 -->
  <g>
    <rect class="write" x="24" y="284" width="208" height="100" rx="16"/>
    <text class="step" x="128" y="308" text-anchor="middle">STEP 6</text>
    <text class="label" x="128" y="336" text-anchor="middle">APPROVE WRITE</text>
    <text class="meta" x="128" y="358" text-anchor="middle">Live user reply, exact token</text>

    <path class="line" d="M232 334 H248"/>
    <rect class="write" x="252" y="284" width="208" height="100" rx="16"/>
    <text class="step" x="356" y="308" text-anchor="middle">STEP 7</text>
    <text class="label" x="356" y="336" text-anchor="middle">EXECUTE</text>
    <text class="meta" x="356" y="358" text-anchor="middle">Only the approved scope</text>

    <path class="line" d="M460 334 H476"/>
    <rect class="read" x="480" y="284" width="208" height="100" rx="16"/>
    <text class="step" x="584" y="308" text-anchor="middle">STEP 8</text>
    <text class="label" x="584" y="336" text-anchor="middle">VERIFY</text>
    <text class="meta" x="584" y="358" text-anchor="middle">G9 · EXECUTED or DESCRIBED</text>

    <path class="line" d="M688 334 H704"/>
    <rect class="final" x="708" y="284" width="208" height="100" rx="16"/>
    <text class="step" x="812" y="308" text-anchor="middle">STEP 9</text>
    <text class="label" x="812" y="336" text-anchor="middle">HONEST COMPLETION</text>
    <text class="meta" x="812" y="358" text-anchor="middle">G10 · SAVED / PROPOSED / UNCHANGED</text>
  </g>

  <text class="meta" x="600" y="440" text-anchor="middle">The WAIT at step 5 is mandatory. Nothing before step 6 authorizes a mutation.</text>
</svg>
