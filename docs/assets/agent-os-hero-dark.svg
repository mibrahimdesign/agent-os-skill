<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc">
  <title id="title">Agent OS Skill: governance for AI coding agents</title>
  <desc id="desc">Agent OS Skill. Governance for AI coding agents. Scope, approval, evidence, honest completion.</desc>
  <defs>
    <pattern id="grid-d" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#242c37"/>
    </pattern>
    <radialGradient id="glow-d" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge-d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3341"/>
      <stop offset="100%" stop-color="#1b212b"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="380" rx="22" fill="#0b0f14"/>
  <rect width="1280" height="380" rx="22" fill="url(#grid-d)"/>
  <rect x="1" y="1" width="1278" height="378" rx="21" fill="none" stroke="url(#edge-d)" stroke-width="1.5"/>

  <circle cx="185" cy="190" r="150" fill="url(#glow-d)"/>

  <!-- refined governance mark: hub + five nodes -->
  <g transform="translate(178,190)">
    <line x1="0" y1="0" x2="0" y2="-64" stroke="#333d4b" stroke-width="1.75"/>
    <line x1="0" y1="0" x2="56" y2="32" stroke="#333d4b" stroke-width="1.75"/>
    <line x1="0" y1="0" x2="-56" y2="32" stroke="#333d4b" stroke-width="1.75"/>
    <line x1="0" y1="0" x2="56" y2="-32" stroke="#333d4b" stroke-width="1.75"/>
    <line x1="0" y1="0" x2="-56" y2="-32" stroke="#333d4b" stroke-width="1.75"/>
    <circle cx="0" cy="-64" r="8" fill="#151a21" stroke="#60a5fa" stroke-width="2.25"/>
    <circle cx="56" cy="32" r="8" fill="#151a21" stroke="#22d3ee" stroke-width="2.25"/>
    <circle cx="-56" cy="32" r="8" fill="#151a21" stroke="#fb923c" stroke-width="2.25"/>
    <circle cx="56" cy="-32" r="8" fill="#151a21" stroke="#4ade80" stroke-width="2.25"/>
    <circle cx="-56" cy="-32" r="8" fill="#151a21" stroke="#a78bfa" stroke-width="2.25"/>
    <circle cx="0" cy="0" r="19" fill="#132339" stroke="#60a5fa" stroke-width="3"/>
  </g>

  <text x="280" y="150" font="600 12.5px ui-sans-serif, system-ui, sans-serif" fill="#7fb1fb" letter-spacing="2.4">GOVERNANCE FOR AI CODING AGENTS</text>
  <text x="280" y="205" font="800 52px ui-sans-serif, system-ui, sans-serif" fill="#f6f8fb" letter-spacing="0.3">Agent OS Skill</text>
  <text x="280" y="245" font="500 19px ui-sans-serif, system-ui, sans-serif" fill="#a9b4c4">Scope control, explicit approval, and evidence-backed honesty — for any coding agent.</text>

  <g font="650 14px ui-sans-serif, system-ui, sans-serif">
    <rect x="280" y="266" width="86" height="30" rx="15" fill="#132339" stroke="#294567"/>
    <text x="323" y="286" text-anchor="middle" fill="#93c5fd">Scope</text>
    <rect x="378" y="266" width="108" height="30" rx="15" fill="#0d2b33" stroke="#1d5765"/>
    <text x="432" y="286" text-anchor="middle" fill="#67e8f9">Approval</text>
    <rect x="498" y="266" width="106" height="30" rx="15" fill="#2a1608" stroke="#7c3f10"/>
    <text x="551" y="286" text-anchor="middle" fill="#fdba74">Evidence</text>
    <rect x="616" y="266" width="182" height="30" rx="15" fill="#0c2015" stroke="#1e4a2c"/>
    <text x="707" y="286" text-anchor="middle" fill="#86efac">Honest completion</text>
  </g>

  <text x="280" y="326" font="500 13px ui-sans-serif, system-ui, sans-serif" fill="#6b7686">Markdown + JSON  ·  no telemetry  ·  no background process  ·  host-neutral</text>
</svg>
