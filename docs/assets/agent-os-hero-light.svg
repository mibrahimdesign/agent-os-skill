<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Agent OS Skill: governance for AI coding agents</title>
  <desc id="desc">Agent OS Skill. Governance for AI coding agents. Scope, approval, evidence, honest completion.</desc>
  <defs>
    <pattern id="grid-l" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#cbd5e1"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" fill="#f8fafc"/>
  <rect width="1280" height="360" fill="url(#grid-l)"/>
  <rect x="1" y="1" width="1278" height="358" rx="20" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <!-- abstract hub-and-node governance mark -->
  <g transform="translate(96,180)" stroke="#94a3b8" stroke-width="1.5">
    <line x1="0" y1="0" x2="0" y2="-56"/>
    <line x1="0" y1="0" x2="49" y2="28"/>
    <line x1="0" y1="0" x2="-49" y2="28"/>
    <line x1="0" y1="0" x2="49" y2="-28"/>
    <line x1="0" y1="0" x2="-49" y2="-28"/>
    <circle cx="0" cy="0" r="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
    <circle cx="0" cy="-56" r="7" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="49" cy="28" r="7" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
    <circle cx="-49" cy="28" r="7" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <circle cx="49" cy="-28" r="7" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <circle cx="-49" cy="-28" r="7" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  </g>

  <text x="216" y="150" font="800 46px ui-sans-serif, system-ui, sans-serif" fill="#0f172a" letter-spacing="1">AGENT OS SKILL</text>
  <text x="216" y="188" font="500 20px ui-sans-serif, system-ui, sans-serif" fill="#334155">Governance for AI coding agents.</text>

  <g font="650 15px ui-sans-serif, system-ui, sans-serif" fill="#1d4ed8">
    <text x="216" y="240">Scope</text>
    <text x="290" y="240" fill="#94a3b8">·</text>
    <text x="308" y="240">Approval</text>
    <text x="404" y="240" fill="#94a3b8">·</text>
    <text x="422" y="240">Evidence</text>
    <text x="518" y="240" fill="#94a3b8">·</text>
    <text x="536" y="240">Honest completion</text>
  </g>

  <text x="216" y="278" font="500 13px ui-sans-serif, system-ui, sans-serif" fill="#64748b">Markdown + JSON · no telemetry · no background process · host-neutral</text>
</svg>
