<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Agent OS Skill request lifecycle</title>
  <desc id="desc">A developer request enters Agent OS Skill, which applies scope and governance, selects a workflow, routes read work directly and write work through a Write Gate and user approval, then verifies and reports.</desc>
  <style>
    :root { color-scheme: light dark; }
    .bg { fill: #f8fafc; }
    .card { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
    .primary { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
    .read { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; }
    .write { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
    .final { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
    .title { fill: #0f172a; font: 700 23px ui-sans-serif, system-ui, sans-serif; }
    .label { fill: #0f172a; font: 650 18px ui-sans-serif, system-ui, sans-serif; }
    .meta { fill: #475569; font: 500 14px ui-sans-serif, system-ui, sans-serif; }
    .branch { fill: #475569; font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .06em; }
    .line { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #64748b; }
      .primary { fill: #102445; stroke: #60a5fa; }
      .read { fill: #083344; stroke: #22d3ee; }
      .write { fill: #431407; stroke: #fb923c; }
      .final { fill: #052e16; stroke: #4ade80; }
      .title, .label { fill: #f8fafc; }
      .meta, .branch { fill: #cbd5e1; }
      .line { stroke: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="560" rx="24"/>
  <text class="title" x="600" y="42" text-anchor="middle">From request to evidence-based completion</text>

  <rect class="card" x="28" y="214" width="224" height="82" rx="16"/>
  <text class="label" x="140" y="248" text-anchor="middle">Developer request</text>
  <text class="meta" x="140" y="272" text-anchor="middle">Natural language or command</text>

  <path class="line" d="M252 255 H292"/>
  <rect class="primary" x="294" y="174" width="230" height="162" rx="20"/>
  <text class="label" x="409" y="218" text-anchor="middle">Agent OS Skill</text>
  <text class="meta" x="409" y="248" text-anchor="middle">Scope and governance</text>
  <path d="M334 270 H484" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="meta" x="409" y="298" text-anchor="middle">Classify and route</text>

  <path class="line" d="M524 255 H590"/>
  <rect class="card" x="592" y="202" width="190" height="106" rx="16"/>
  <text class="label" x="687" y="244" text-anchor="middle">Workflow</text>
  <text class="meta" x="687" y="271" text-anchor="middle">Select the focused path</text>

  <path class="line" d="M782 238 C836 238 826 142 884 142"/>
  <text class="branch" x="824" y="185" text-anchor="middle">READ</text>
  <rect class="read" x="886" y="94" width="250" height="96" rx="16"/>
  <text class="label" x="1011" y="133" text-anchor="middle">Inspect and analyze</text>
  <text class="meta" x="1011" y="160" text-anchor="middle">No write approval required</text>

  <path class="line" d="M782 272 C836 272 826 386 884 386"/>
  <text class="branch" x="824" y="348" text-anchor="middle">WRITE</text>
  <rect class="write" x="886" y="326" width="250" height="120" rx="16"/>
  <text class="label" x="1011" y="365" text-anchor="middle">Write Gate</text>
  <text class="meta" x="1011" y="392" text-anchor="middle">Developer reviews scope</text>
  <text class="meta" x="1011" y="419" text-anchor="middle">APPROVE WRITE before mutation</text>

  <path class="line" d="M1011 190 V238 C1011 266 858 266 858 484 H710"/>
  <path class="line" d="M1011 446 V484 H710"/>
  <rect class="final" x="430" y="444" width="280" height="82" rx="16"/>
  <text class="label" x="570" y="478" text-anchor="middle">Verify and report</text>
  <text class="meta" x="570" y="503" text-anchor="middle">Executed evidence, limits, and state</text>
</svg>
