  <rect width="1280" height="640" fill="url(#glow-sp)"/>

  <!-- safe zone: content kept within x:128-1152, y:64-576 -->

  <g transform="translate(640,196)">
    <line x1="0" y1="0" x2="0" y2="-72" stroke="#333d4b" stroke-width="2"/>
