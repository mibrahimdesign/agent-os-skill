<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">The same request, without and with Agent OS Skill</title>
  <desc id="desc">Without governance, an agent can silently expand scope, run unverified checks, and claim completion. With Agent OS Skill, the same request produces identified scope, an inspected state, a visible Write Gate, explicit approval, evidence-backed verification, and completion claims that match what actually happened.</desc>
  <style>
    :root { color-scheme: light dark; }
    .bg { fill: #f8fafc; }
    .without { fill: #fef2f2; stroke: #dc2626; stroke-width: 2.5; }
    .with { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2.5; }
    .quote { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .title { fill: #0f172a; font: 700 22px ui-sans-serif, system-ui, sans-serif; }
    .label { fill: #0f172a; font: 800 18px ui-sans-serif, system-ui, sans-serif; }
    .quotetext { fill: #334155; font: 600 italic 14px ui-sans-serif, system-ui, sans-serif; }
    .bad { fill: #991b1b; font: 600 13.5px ui-sans-serif, system-ui, sans-serif; }
    .good { fill: #166534; font: 600 13.5px ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .without { fill: #450a0a; stroke: #f87171; }
      .with { fill: #052e16; stroke: #4ade80; }
      .quote { fill: #161b22; stroke: #64748b; }
      .title, .label { fill: #f8fafc; }
      .quotetext { fill: #cbd5e1; }
      .bad { fill: #fca5a5; }
      .good { fill: #86efac; }
    }
  </style>
  <rect class="bg" width="1200" height="560" rx="24"/>
  <text class="title" x="600" y="42" text-anchor="middle">The same request, two different outcomes</text>

  <rect class="quote" x="24" y="66" width="1152" height="52" rx="12"/>
  <text class="quotetext" x="600" y="99" text-anchor="middle">"Fix the authentication issue."</text>

  <!-- WITHOUT -->
  <rect class="without" x="24" y="140" width="560" height="392" rx="18"/>
  <text class="label" x="304" y="178" text-anchor="middle">WITHOUT AGENT OS</text>
  <text class="bad" x="52" y="222">✕ Scope is not identified up front</text>
  <text class="bad" x="52" y="256">✕ Agent changes 9 files, unbounded</text>
  <text class="bad" x="52" y="290">✕ Runs unknown or no checks</text>
  <text class="bad" x="52" y="324">✕ Repository text can look authoritative</text>
  <text class="bad" x="52" y="358">✕ Says "done" without evidence</text>
  <text class="bad" x="52" y="392">✕ No record of what was actually approved</text>
  <text class="bad" x="52" y="426">✕ Completion is a claim, not a report</text>

  <!-- WITH -->
  <rect class="with" x="616" y="140" width="560" height="392" rx="18"/>
  <text class="label" x="896" y="178" text-anchor="middle">WITH AGENT OS SKILL</text>
  <text class="good" x="644" y="222">✓ Scope identified before any change</text>
  <text class="good" x="644" y="256">✓ Relevant state inspected first (G2)</text>
  <text class="good" x="644" y="290">✓ Write Gate shown, exact files listed</text>
  <text class="good" x="644" y="324">✓ User explicitly replies APPROVE WRITE</text>
  <text class="good" x="644" y="358">✓ Only the approved scope changes</text>
  <text class="good" x="644" y="392">✓ Verification evidence captured (G9)</text>
  <text class="good" x="644" y="426">✓ Completion claims match the evidence (G10)</text>

  <text class="quotetext" x="600" y="500" text-anchor="middle" style="font-style:normal">The difference is the governance contract, not a claim that other agents are inherently unsafe.</text>
</svg>
