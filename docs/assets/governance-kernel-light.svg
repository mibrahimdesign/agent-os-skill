<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">Agent OS Skill governance kernel, G1 through G10</title>
  <desc id="desc">Ten non-negotiable governance rules surround the Agent OS Skill core: Scope Lock, Read Before Write, Explicit Write Control, Instruction Isolation, Capability Honesty, Evidence Before Claims, State Honesty, Secret Safety, Verification Integrity, and Completion Honesty.</desc>
  <defs>
    <radialGradient id="hubfill-l" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbe8fe"/>
    </radialGradient>
  </defs>
  <style>
    .node { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .title { fill: #0b1220; font: 700 21px ui-sans-serif, system-ui, sans-serif; }
    .hubtext { fill: #1d4ed8; font: 800 19px ui-sans-serif, system-ui, sans-serif; }
    .num { fill: #ffffff; font: 800 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .name { fill: #0b1220; font: 650 13.5px ui-sans-serif, system-ui, sans-serif; }
    .spoke { stroke: #dbe3ee; stroke-width: 1.5; }
    .foot { fill: #7788a0; font: 500 13px ui-sans-serif, system-ui, sans-serif; }
  </style>
  <text class="title" x="600" y="34" text-anchor="middle">Ten rules apply to every workflow, without exception</text>

  <line class="spoke" x1="600" y1="380" x2="600" y2="150"/>
  <line class="spoke" x1="600" y1="380" x2="735" y2="194"/>
  <line class="spoke" x1="600" y1="380" x2="819" y2="309"/>
  <line class="spoke" x1="600" y1="380" x2="819" y2="451"/>
  <line class="spoke" x1="600" y1="380" x2="735" y2="566"/>
  <line class="spoke" x1="600" y1="380" x2="600" y2="610"/>
  <line class="spoke" x1="600" y1="380" x2="465" y2="566"/>
  <line class="spoke" x1="600" y1="380" x2="381" y2="451"/>
  <line class="spoke" x1="600" y1="380" x2="381" y2="309"/>
  <line class="spoke" x1="600" y1="380" x2="465" y2="194"/>

  <circle cx="600" cy="380" r="104" fill="url(#hubfill-l)" stroke="#93c5fd" stroke-width="2.5"/>
  <text class="hubtext" x="600" y="372" text-anchor="middle">AGENT OS</text>
  <text class="hubtext" x="600" y="394" text-anchor="middle">GOVERNANCE</text>

  <g>
    <rect class="node" x="530" y="120" width="140" height="60" rx="14"/>
    <circle cx="548" cy="138" r="13" fill="#2563eb"/><text class="num" x="548" y="142" text-anchor="middle">1</text>
    <text class="name" x="608" y="143" text-anchor="middle">Scope Lock</text>
  </g>
  <g>
    <rect class="node" x="665" y="164" width="140" height="60" rx="14"/>
    <circle cx="683" cy="182" r="13" fill="#0891b2"/><text class="num" x="683" y="186" text-anchor="middle">2</text>
    <text class="name" x="743" y="187" text-anchor="middle">Read Before Write</text>
  </g>
  <g>
    <rect class="node" x="749" y="279" width="140" height="60" rx="14"/>
    <circle cx="767" cy="297" r="13" fill="#ea580c"/><text class="num" x="767" y="301" text-anchor="middle">3</text>
    <text class="name" x="827" y="302" text-anchor="middle">Explicit Write Control</text>
  </g>
  <g>
    <rect class="node" x="749" y="421" width="140" height="60" rx="14"/>
    <circle cx="767" cy="439" r="13" fill="#7c3aed"/><text class="num" x="767" y="443" text-anchor="middle">4</text>
    <text class="name" x="827" y="444" text-anchor="middle">Instruction Isolation</text>
  </g>
  <g>
    <rect class="node" x="665" y="536" width="140" height="60" rx="14"/>
    <circle cx="683" cy="554" r="13" fill="#16a34a"/><text class="num" x="683" y="558" text-anchor="middle">5</text>
    <text class="name" x="743" y="559" text-anchor="middle">Capability Honesty</text>
  </g>
  <g>
    <rect class="node" x="530" y="580" width="140" height="60" rx="14"/>
    <circle cx="548" cy="598" r="13" fill="#2563eb"/><text class="num" x="548" y="602" text-anchor="middle">6</text>
    <text class="name" x="608" y="603" text-anchor="middle">Evidence Before Claims</text>
  </g>
  <g>
    <rect class="node" x="395" y="536" width="140" height="60" rx="14"/>
    <circle cx="413" cy="554" r="13" fill="#0891b2"/><text class="num" x="413" y="558" text-anchor="middle">7</text>
    <text class="name" x="473" y="559" text-anchor="middle">State Honesty</text>
  </g>
  <g>
    <rect class="node" x="311" y="421" width="140" height="60" rx="14"/>
    <circle cx="329" cy="439" r="13" fill="#ea580c"/><text class="num" x="329" y="443" text-anchor="middle">8</text>
    <text class="name" x="389" y="444" text-anchor="middle">Secret Safety</text>
  </g>
  <g>
    <rect class="node" x="311" y="279" width="140" height="60" rx="14"/>
    <circle cx="329" cy="297" r="13" fill="#7c3aed"/><text class="num" x="329" y="301" text-anchor="middle">9</text>
    <text class="name" x="389" y="302" text-anchor="middle">Verification Integrity</text>
  </g>
  <g>
    <rect class="node" x="395" y="164" width="140" height="60" rx="14"/>
    <circle cx="413" cy="182" r="14" fill="#16a34a"/><text class="num" x="413" y="186" text-anchor="middle">10</text>
    <text class="name" x="475" y="187" text-anchor="middle">Completion Honesty</text>
  </g>

  <text class="foot" x="600" y="700" text-anchor="middle">AVAILABLE != AUTHORIZED != APPROVED — every rule applies regardless of host or capability.</text>
</svg>
