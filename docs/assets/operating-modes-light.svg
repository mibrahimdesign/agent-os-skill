<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Agent OS Skill operating modes: FULL, LIMITED, EMBEDDED</title>
  <desc id="desc">Three operating modes describe available capability, not honesty. FULL has filesystem and command execution. LIMITED is missing some required capability and adapts honestly. EMBEDDED has no persistence and only proposes changes, never claiming a save.</desc>
  <style>
    .full { fill: #ffffff; stroke: #bbf7d0; stroke-width: 1.75; }
    .limited { fill: #ffffff; stroke: #fed7aa; stroke-width: 1.75; }
    .embedded { fill: #ffffff; stroke: #ddd6fe; stroke-width: 1.75; }
    .banner { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.5; }
    .title { fill: #0b1220; font: 700 21px ui-sans-serif, system-ui, sans-serif; }
    .label { fill: #0b1220; font: 800 18px ui-sans-serif, system-ui, sans-serif; }
    .meta { fill: #55637a; font: 600 13px ui-sans-serif, system-ui, sans-serif; }
    .bullet { fill: #3d4a5f; font: 500 13px ui-sans-serif, system-ui, sans-serif; }
    .bannertext { fill: #1d4ed8; font: 650 14.5px ui-sans-serif, system-ui, sans-serif; }
  </style>
  <text class="title" x="600" y="34" text-anchor="middle">Capability changes what runs. It never changes what may be claimed.</text>

  <!-- FULL -->
  <rect class="full" x="24" y="62" width="368" height="288" rx="18"/>
  <rect x="24" y="62" width="368" height="6" rx="3" fill="#16a34a"/>
  <text class="label" x="208" y="104" text-anchor="middle">FULL</text>
  <circle cx="176" cy="126" r="4" fill="#16a34a"/><circle cx="192" cy="126" r="4" fill="#16a34a"/><circle cx="208" cy="126" r="4" fill="#16a34a"/>
  <text class="meta" x="208" y="150" text-anchor="middle">Filesystem + command execution verified</text>
  <line x1="52" y1="170" x2="364" y2="170" stroke="#f1f5f9"/>
  <text class="bullet" x="52" y="198">Inspects and modifies a real project</text>
  <text class="bullet" x="52" y="224">Verifies with real, run commands</text>
  <text class="bullet" x="52" y="250">Claims backed by EXECUTED evidence</text>
  <text class="bullet" x="52" y="276">Write Gate leads directly to a SAVED state</text>

  <!-- LIMITED -->
  <rect class="limited" x="416" y="62" width="368" height="288" rx="18"/>
  <rect x="416" y="62" width="368" height="6" rx="3" fill="#ea580c"/>
  <text class="label" x="600" y="104" text-anchor="middle">LIMITED</text>
  <circle cx="568" cy="126" r="4" fill="#ea580c"/><circle cx="584" cy="126" r="4" fill="#ea580c"/><circle cx="600" cy="126" r="4" fill="#e2e8f0"/>
  <text class="meta" x="600" y="150" text-anchor="middle">One or more capabilities missing</text>
  <line x1="444" y1="170" x2="756" y2="170" stroke="#f1f5f9"/>
  <text class="bullet" x="444" y="198">Adapts the workflow, does not invent</text>
  <text class="bullet" x="444" y="224">States plainly what is unavailable</text>
  <text class="bullet" x="444" y="250">Verification marked DESCRIBED where it</text>
  <text class="bullet" x="444" y="270">could not actually run</text>
  <text class="bullet" x="444" y="296">Still requires APPROVE WRITE to mutate</text>

  <!-- EMBEDDED -->
  <rect class="embedded" x="808" y="62" width="368" height="288" rx="18"/>
  <rect x="808" y="62" width="368" height="6" rx="3" fill="#7c3aed"/>
  <text class="label" x="992" y="104" text-anchor="middle">EMBEDDED</text>
  <circle cx="960" cy="126" r="4" fill="#7c3aed"/><circle cx="976" cy="126" r="4" fill="#e2e8f0"/><circle cx="992" cy="126" r="4" fill="#e2e8f0"/>
  <text class="meta" x="992" y="150" text-anchor="middle">No persistence capability</text>
  <line x1="836" y1="170" x2="1148" y2="170" stroke="#f1f5f9"/>
  <text class="bullet" x="836" y="198">Analyzes, reviews, and proposes only</text>
  <text class="bullet" x="836" y="224">Produces PROPOSED STATE UPDATE blocks</text>
  <text class="bullet" x="836" y="250">Never claims a file was saved</text>
  <text class="bullet" x="836" y="276">Same G1-G10 rules, same honesty bar</text>

  <rect class="banner" x="24" y="376" width="1152" height="56" rx="14"/>
  <text class="bannertext" x="600" y="410" text-anchor="middle">Less capability changes what Agent OS can execute. It does not change what Agent OS may claim.</text>
</svg>
