<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Read versus write decision flow</title>
  <desc id="desc">A user task is classified by whether source mutation is required. Read tasks inspect and report without approval. Write tasks inspect first, present a Write Gate, wait for approval, change only approved scope, then join verification and reporting.</desc>
  <style>
    :root { color-scheme: light dark; }
    .bg { fill: #f8fafc; }
    .neutral { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
    .decision { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
    .read { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; }
    .write { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
    .wait { fill: #fef2f2; stroke: #dc2626; stroke-width: 3; }
    .final { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
    .title { fill: #0f172a; font: 700 22px ui-sans-serif, system-ui, sans-serif; }
    .label { fill: #0f172a; font: 650 17px ui-sans-serif, system-ui, sans-serif; }
    .meta { fill: #475569; font: 500 13px ui-sans-serif, system-ui, sans-serif; }
    .branch { fill: #475569; font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .line { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .neutral { fill: #161b22; stroke: #64748b; }
      .decision { fill: #102445; stroke: #60a5fa; }
      .read { fill: #083344; stroke: #22d3ee; }
      .write { fill: #431407; stroke: #fb923c; }
      .wait { fill: #450a0a; stroke: #f87171; }
      .final { fill: #052e16; stroke: #4ade80; }
      .title, .label { fill: #f8fafc; }
      .meta, .branch { fill: #cbd5e1; }
      .line { stroke: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="620" rx="24"/>
  <text class="title" x="600" y="40" text-anchor="middle">The most important decision: does the task require source mutation?</text>
  <rect class="neutral" x="485" y="66" width="230" height="68" rx="16"/>
  <text class="label" x="600" y="106" text-anchor="middle">User task</text>
  <path class="line" d="M600 134 V178"/>
  <path class="decision" d="M600 178 L760 250 L600 322 L440 250 Z"/>
  <text class="label" x="600" y="241" text-anchor="middle">Source mutation</text>
  <text class="label" x="600" y="266" text-anchor="middle">required?</text>

  <path class="line" d="M440 250 H294"/>
  <text class="branch" x="368" y="237" text-anchor="middle">NO</text>
  <rect class="read" x="54" y="204" width="240" height="92" rx="16"/>
  <text class="label" x="174" y="241" text-anchor="middle">READ</text>
  <text class="meta" x="174" y="268" text-anchor="middle">Inspect · analyze · no approval</text>
  <path class="line" d="M174 296 V505 H456"/>

  <path class="line" d="M760 250 H850"/>
  <text class="branch" x="804" y="237" text-anchor="middle">YES</text>
  <rect class="write" x="852" y="194" width="294" height="112" rx="16"/>
  <text class="label" x="999" y="229" text-anchor="middle">WRITE</text>
  <text class="meta" x="999" y="255" text-anchor="middle">Inspect and diagnose first</text>
  <text class="meta" x="999" y="278" text-anchor="middle">Prepare exact scope and plan</text>
  <path class="line" d="M999 306 V346"/>
  <rect class="write" x="852" y="348" width="294" height="70" rx="16"/>
  <text class="label" x="999" y="378" text-anchor="middle">Write Gate</text>
  <text class="meta" x="999" y="401" text-anchor="middle">Files · changes · risk · exclusions</text>
  <path class="line" d="M999 418 V448"/>
  <rect class="wait" x="852" y="450" width="294" height="70" rx="16"/>
  <text class="label" x="999" y="480" text-anchor="middle">WAIT</text>
  <text class="meta" x="999" y="503" text-anchor="middle">No mutation before APPROVE WRITE</text>
  <text class="branch" x="802" y="440" text-anchor="middle">APPROVE WRITE</text>
  <path class="line" d="M852 485 H752"/>
  <rect class="write" x="536" y="450" width="216" height="70" rx="16"/>
  <text class="label" x="644" y="480" text-anchor="middle">Approved scope only</text>
  <text class="meta" x="644" y="503" text-anchor="middle">Implement</text>
  <path class="line" d="M536 505 H456"/>

  <rect class="final" x="210" y="545" width="780" height="52" rx="15"/>
  <text class="label" x="600" y="577" text-anchor="middle">Verify honestly → Report saved, proposed, and unchanged state</text>
  <path class="line" d="M456 505 V545"/>
</svg>
