<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Agent OS Skill workflow map</title>
  <desc id="desc">The ten workflows are grouped into orientation, analysis, and controlled change. Read-only workflows are teal, write-gated workflows are orange, and the two optional explicit commands are neutral.</desc>
  <style>
    :root { color-scheme: light dark; }
    .bg { fill: #f8fafc; }
    .hub { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
    .group { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .read { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; }
    .write { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
    .optional { fill: #f8fafc; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 5; }
    .title { fill: #0f172a; font: 700 22px ui-sans-serif, system-ui, sans-serif; }
    .heading { fill: #0f172a; font: 700 18px ui-sans-serif, system-ui, sans-serif; }
    .label { fill: #0f172a; font: 650 15px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .meta { fill: #475569; font: 500 13px ui-sans-serif, system-ui, sans-serif; }
    .line { fill: none; stroke: #64748b; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .hub { fill: #102445; stroke: #60a5fa; }
      .group { fill: #161b22; stroke: #475569; }
      .read { fill: #083344; stroke: #22d3ee; }
      .write { fill: #431407; stroke: #fb923c; }
      .optional { fill: #161b22; stroke: #94a3b8; }
      .title, .heading, .label { fill: #f8fafc; }
      .meta { fill: #cbd5e1; }
      .line { stroke: #64748b; }
    }
  </style>
  <rect class="bg" width="1200" height="650" rx="24"/>
  <text class="title" x="600" y="42" text-anchor="middle">One router, focused workflows</text>
  <rect class="hub" x="465" y="68" width="270" height="78" rx="18"/>
  <text class="heading" x="600" y="101" text-anchor="middle">Agent OS Skill</text>
  <text class="meta" x="600" y="126" text-anchor="middle">Classifies intent and operation</text>

  <path class="line" d="M600 146 V180 M200 180 H1000 M200 180 V218 M600 180 V218 M1000 180 V218"/>

  <rect class="group" x="45" y="218" width="310" height="378" rx="20"/>
  <text class="heading" x="200" y="255" text-anchor="middle">Orient</text>
  <text class="meta" x="200" y="279" text-anchor="middle">Learn context without changing it</text>
  <rect class="read" x="75" y="309" width="250" height="68" rx="14"/>
  <text class="label" x="200" y="338" text-anchor="middle">UNDERSTAND PROJECT</text>
  <text class="meta" x="200" y="360" text-anchor="middle">READ_ONLY</text>
  <rect class="optional" x="75" y="399" width="250" height="68" rx="14"/>
  <text class="label" x="200" y="428" text-anchor="middle">PREPARE PROJECT</text>
  <text class="meta" x="200" y="450" text-anchor="middle">STRICT READ_ONLY · explicit</text>
  <rect class="optional" x="75" y="489" width="250" height="78" rx="14"/>
  <text class="label" x="200" y="519" text-anchor="middle">EXPORT STATE</text>
  <text class="meta" x="200" y="541" text-anchor="middle">STRICT READ_ONLY · explicit</text>
  <text class="meta" x="200" y="558" text-anchor="middle">Represents state; saves nothing</text>

  <rect class="group" x="445" y="218" width="310" height="378" rx="20"/>
  <text class="heading" x="600" y="255" text-anchor="middle">Analyze</text>
  <text class="meta" x="600" y="279" text-anchor="middle">Inspect evidence and report</text>
  <rect class="read" x="475" y="305" width="250" height="58" rx="14"/>
  <text class="label" x="600" y="339" text-anchor="middle">REVIEW</text>
  <rect class="read" x="475" y="382" width="250" height="58" rx="14"/>
  <text class="label" x="600" y="416" text-anchor="middle">SECURITY REVIEW</text>
  <rect class="read" x="475" y="459" width="250" height="58" rx="14"/>
  <text class="label" x="600" y="493" text-anchor="middle">QUALITY CHECK</text>
  <rect class="read" x="475" y="536" width="250" height="38" rx="12"/>
  <text class="label" x="600" y="561" text-anchor="middle">READ DESIGN</text>

  <rect class="group" x="845" y="218" width="310" height="378" rx="20"/>
  <text class="heading" x="1000" y="255" text-anchor="middle">Change</text>
  <text class="meta" x="1000" y="279" text-anchor="middle">Inspect, gate, approve, implement</text>
  <rect class="write" x="875" y="320" width="250" height="68" rx="14"/>
  <text class="label" x="1000" y="350" text-anchor="middle">FIX BUG</text>
  <text class="meta" x="1000" y="372" text-anchor="middle">WRITE GATE REQUIRED</text>
  <rect class="write" x="875" y="418" width="250" height="68" rx="14"/>
  <text class="label" x="1000" y="448" text-anchor="middle">CREATE FEATURE</text>
  <text class="meta" x="1000" y="470" text-anchor="middle">WRITE GATE REQUIRED</text>
  <rect class="write" x="875" y="516" width="250" height="58" rx="14"/>
  <text class="label" x="1000" y="550" text-anchor="middle">IMPROVE UI UX</text>

  <rect class="read" x="420" y="615" width="16" height="16" rx="4"/>
  <text class="meta" x="445" y="628">Read-only</text>
  <rect class="write" x="570" y="615" width="16" height="16" rx="4"/>
  <text class="meta" x="595" y="628">Write-gated</text>
  <rect class="optional" x="735" y="615" width="16" height="16" rx="4"/>
  <text class="meta" x="760" y="628">Optional explicit command</text>
</svg>
